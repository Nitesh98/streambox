<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamBox</title>
  <meta name="description" content="StreamBox: a video streaming web app built with HTML, CSS and JavaScript." />
  <!-- Only allow code, styles and media from trusted places -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; media-src https:; style-src 'self'; script-src 'self'" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Toggle menu">☰</button>
    <a class="brand" href="#/">
      <img src="assets/logo.svg" alt="" width="28" height="28" />
      <span>StreamBox</span>
    </a>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" placeholder="Search" aria-label="Search videos" maxlength="100" />
      <button type="submit" aria-label="Search">🔍</button>
    </form>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode">🌙</button>
  </header>

  <nav class="sidebar" id="sidebar">
    <a href="#/" data-nav="home">🏠 <span>Home</span></a>
    <a href="#/library/liked" data-nav="liked">👍 <span>Liked videos</span></a>
    <a href="#/library/later" data-nav="later">🕒 <span>Watch later</span></a>
    <a href="#/library/history" data-nav="history">📜 <span>History</span></a>
  </nav>

  <main id="app" tabindex="-1"></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
